services:
  youtube-mcp:
    build: .
    image: tubelens-mcp:local
    restart: unless-stopped
    init: true
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - ./data:/data
    stop_grace_period: 30s
