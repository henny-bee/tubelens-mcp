[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tubelens-mcp"
version = "1.0.0"
description = "Self-hosted Tubelens MCP server with caption-first pipeline and bounded CPU Whisper fallback."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.6.0,<3.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "starlette>=0.45.0,<2.0.0",
    "uvicorn>=0.34.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "youtube-transcript-api>=1.2.4,<2.0.0",
    "yt-dlp[default]>=2026.2.4",
    "faster-whisper>=1.1.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[project.scripts]
youtube-mcp = "youtube_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
